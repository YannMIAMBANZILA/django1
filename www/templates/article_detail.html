{% extends "base.html" %}

{% block content %}
<div class="mb-4">
  <a href="/" class="btn btn-outline-secondary btn-sm">&larr; Retour à la liste</a>
</div>

<div class="row">
  <div class="col-12">
    <h1 class="h3">{{ article.title }}</h1>
    <p class="text-muted small">Publié le {{ article.published_at|date:"Y-m-d H:i" }} • {{ article.user }}</p>
  </div>

  {% if article.thumb_url %}
    <div class="col-12 mb-3">
      <img src="{{ article.thumb_url }}" class="img-fluid rounded" alt="{{ article.title }}">
    </div>
  {% endif %}

  <div class="col-12">
    <div class="content">
      {{ article.content|safe }}
    </div>
  </div>
</div>

{% endblock %}
